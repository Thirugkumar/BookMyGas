{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card p-5 text-center">
            <i class="fa-solid fa-circle-check text-success fa-4x mb-4"></i>
            <h2 class="fw-bold mb-3">Confirm Booking</h2>
            <p class="text-muted mb-4">You are about to book a gas cylinder from <strong>{{ cylinder.supplier_name }}</strong>.</p>
            
            <div class="bg-light rounded p-4 mb-4 text-start">
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                    <span class="text-muted">Type:</span>
                    <span class="fw-semibold">{{ cylinder.get_cylinder_type_display }}</span>
                </div>
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                    <span class="text-muted">Location:</span>
                    <span class="fw-semibold">{{ cylinder.location }}</span>
                </div>
                <div class="d-flex justify-content-between pt-2">
                    <span class="text-muted">Total Price:</span>
                    <span class="fw-bold text-primary fs-5">LKR {{ cylinder.price }}</span>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-50">Cancel</a>
                    <button type="submit" class="btn btn-primary w-50">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
