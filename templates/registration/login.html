{% extends 'base.html' %}
{% block main_class %}p-0{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-fire-flame-simple text-danger fa-3x mb-3"></i>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted">Login to book your gas cylinder</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password.
                </div>
            {% endif %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label text-muted fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
            </div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <label for="id_password" class="form-label text-muted fw-semibold">Password</label>
                    <a href="#" class="text-decoration-none small text-primary">Forgot Password?</a>
                </div>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            
            <div class="text-center">
                <span class="text-muted">Don't have an account?</span> 
                <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Register here</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
